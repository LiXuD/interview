spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  agent:
    dispatch-enabled: true
    async-enabled: false
    executor-core-pool-size: 1
    executor-max-pool-size: 1
    executor-queue-capacity: 10
  auth:
    dev-login-enabled: true
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMzJieXRlcw==
    expiration-ms: 3600000
  ai:
    encryption-key: dGVzdC1haS1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
    spring:
      enabled: false
    http:
      connect-timeout-ms: 5000
      read-timeout-ms: 60000
    platform:
      require-real-for-coaching: false
      enabled: false
  apple:
    services-id: com.interviewcoach.app
