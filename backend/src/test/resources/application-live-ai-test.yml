# Live AI 验收测试专用配置
# 需要同时设置 IC_LIVE_AI_TEST=true 环境变量才会运行
# 平台 AI 配置从 IC_PLATFORM_AI_* 环境变量读取（参考 backend/.env）
spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
  datasource:
    url: jdbc:h2:mem:liveaitestdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  agent:
    dispatch-enabled: true
    async-enabled: true
    executor-core-pool-size: 1
    executor-max-pool-size: 1
    executor-queue-capacity: 100
  auth:
    dev-login-enabled: true
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktMzJieXRlcw==
    expiration-ms: 28800000
  ai:
    encryption-key: dGVzdC1haS1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
    spring:
      enabled: ${IC_SPRING_AI_ENABLED:false}
    http:
      connect-timeout-ms: ${IC_AI_HTTP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${IC_AI_HTTP_READ_TIMEOUT_MS:60000}
    platform:
      # 验收测试必须使用真实 AI，禁止回退到 stub
      enabled: ${IC_PLATFORM_AI_ENABLED:true}
      base-url: ${IC_PLATFORM_AI_BASE_URL:}
      api-key: ${IC_PLATFORM_AI_API_KEY:}
      model: ${IC_PLATFORM_AI_MODEL:}
      mode: ${IC_PLATFORM_AI_MODE:chatCompletions}
      # 验收测试要求核心教练路径使用真实 AI
      require-real-for-coaching: ${IC_REQUIRE_REAL_AI_FOR_COACHING:true}
  apple:
    services-id: com.interviewcoach.app
