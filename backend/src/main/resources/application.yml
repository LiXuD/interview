server:
  port: 18080

spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    chat:
      client:
        enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_coach
    username: ic_user
    password: ic_dev_password
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  agent:
    dispatch-enabled: true
    async-enabled: true
    executor-core-pool-size: 1
    executor-max-pool-size: 1
    executor-queue-capacity: 100
  admin:
    usernames: ${IC_ADMIN_USERNAMES:}
  auth:
    dev-login-enabled: true
  jwt:
    secret: OqdiowA+wbDLSdp8HFj7qcbW36V0mtilujurTO496HU=
    expiration-ms: 604800000
  ai:
    encryption-key: ZGV2LWFpLWVuY3J5cHRpb24ta2V5LTMyLWJ5dGVzISE=
    spring:
      enabled: ${IC_SPRING_AI_ENABLED:false}
    http:
      connect-timeout-ms: ${IC_AI_HTTP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${IC_AI_HTTP_READ_TIMEOUT_MS:60000}
    platform:
      require-real-for-coaching: ${IC_REQUIRE_REAL_AI_FOR_COACHING:true}
      enabled: ${IC_PLATFORM_AI_ENABLED:false}
      base-url: ${IC_PLATFORM_AI_BASE_URL:}
      api-key: ${IC_PLATFORM_AI_API_KEY:}
      model: ${IC_PLATFORM_AI_MODEL:}
      mode: ${IC_PLATFORM_AI_MODE:chatCompletions}
  apple:
    services-id: com.interviewcoach.app
  wechat:
    login-enabled: ${IC_WECHAT_LOGIN_ENABLED:false}
    mini-program:
      app-id: ${IC_WECHAT_MINI_PROGRAM_APP_ID:}
      app-secret: ${IC_WECHAT_MINI_PROGRAM_APP_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: interview-coach
