openapi: 3.1.0
info:
  title: Interview Coach API
  version: 0.2.0
  description: API contract for the AI technical interview coach app.
servers:
  - url: http://localhost:18080
    description: Local development server
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags:
        - Health
      summary: Check backend health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Backend is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: "UP"
                    service: "interview-coach-backend"

  /api/auth/dev-login:
    post:
      tags:
        - Auth
      summary: Dev login with username
      operationId: devLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /api/auth/apple:
    post:
      tags:
        - Auth
      summary: Sign in with Apple
      operationId: appleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleLoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: "Apple authentication failed (code: APPLE_AUTH_FAILED)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current user
      operationId: logout
      responses:
        "204":
          description: Logged out.

  /api/me:
    get:
      tags:
        - Auth
      summary: Get current user
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Auth
      summary: Delete current user account
      operationId: deleteCurrentUser
      responses:
        "204":
          description: Account deleted.
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/targets:
    post:
      tags:
        - Target
      summary: Create interview target
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewTargetCreateRequest"
      responses:
        "201":
          description: Target created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTargetDto"
    get:
      tags:
        - Target
      summary: List interview targets
      operationId: listTargets
      responses:
        "200":
          description: List of targets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InterviewTargetDto"

  /api/targets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Target
      summary: Get interview target by ID
      operationId: getTarget
      responses:
        "200":
          description: Target found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTargetDto"
        "404":
          description: Target not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Target
      summary: Update interview target
      operationId: updateTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewTargetUpdateRequest"
      responses:
        "200":
          description: Target updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTargetDto"
        "404":
          description: Target not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Target
      summary: Delete interview target
      operationId: deleteTarget
      responses:
        "204":
          description: Target deleted.
        "404":
          description: Target not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/profiles/draft-summary:
    post:
      tags:
        - Profile
      summary: Generate draft summary from resume text
      operationId: draftSummary
      description: >
        Temporarily sends resume text to backend AI for summary generation.
        Text is not persisted - only the confirmed summary is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfileDraftRequest"
      responses:
        "200":
          description: Draft summary generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfileDraftDto"

  /api/profiles/confirm:
    post:
      tags:
        - Profile
      summary: Confirm and save candidate profile
      operationId: confirmProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfileConfirmRequest"
      responses:
        "200":
          description: Profile confirmed and saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfileDto"

  /api/profiles/current:
    get:
      tags:
        - Profile
      summary: Get current confirmed profile
      operationId: getCurrentProfile
      parameters:
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfileDto"
        "404":
          description: No confirmed profile found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/job-briefs/generate:
    post:
      tags:
        - JobBrief
      summary: Generate job brief for a target
      operationId: generateJobBrief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobBriefGenerateRequest"
      responses:
        "200":
          description: Job brief generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobBriefDto"
        "400":
          description: AI structured output parse failed or request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target or confirmed candidate profile not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/job-briefs/{targetId}:
    parameters:
      - name: targetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - JobBrief
      summary: Get job brief by target ID
      operationId: getJobBrief
      responses:
        "200":
          description: Job brief found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobBriefDto"
        "404":
          description: Job brief not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/assessments/start:
    post:
      tags:
        - Assessment
      summary: Start assessment session
      operationId: startAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentStartRequest"
      responses:
        "200":
          description: Assessment started with first question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSessionDto"

  /api/assessments/{id}/answers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Assessment
      summary: Submit answer for current question
      operationId: submitAssessmentAnswer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentAnswerRequest"
      responses:
        "200":
          description: Answer submitted, next question or completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSessionDto"

  /api/assessments/{id}/finish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Assessment
      summary: Finish assessment and generate result
      operationId: finishAssessment
      responses:
        "200":
          description: Assessment result generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResultDto"

  /api/assessments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Assessment
      summary: Get assessment session
      operationId: getAssessment
      responses:
        "200":
          description: Assessment session found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSessionDto"

  /api/dimension-analysis:
    get:
      tags:
        - Assessment
      summary: Analyze dimension performance across assessments and interviews
      operationId: analyzeDimensions
      parameters:
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dimension analysis result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DimensionAnalysisDto"

  /api/progress:
    get:
      tags:
        - Progress
      summary: Get progress dashboard for a target
      operationId: getProgressDashboard
      parameters:
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Progress dashboard data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressDashboardDto"

  /api/training-plans/generate:
    post:
      tags:
        - Training
      summary: Generate training plan based on weaknesses
      operationId: generateTrainingPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingPlanGenerateRequest"
      responses:
        "200":
          description: Training plan generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPlanDto"

  /api/training-plans/{targetId}:
    parameters:
      - name: targetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Training
      summary: Get training plan by target ID
      operationId: getTrainingPlan
      responses:
        "200":
          description: Training plan found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPlanDto"

  /api/training-tasks/{id}/answer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Training
      summary: Submit answer for training task
      operationId: answerTrainingTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingTaskAnswerRequest"
      responses:
        "200":
          description: Training feedback generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingFeedbackDto"

  /api/training-tasks/{id}/adaptive-sessions/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Training
      summary: Start adaptive training session for a training task
      operationId: startAdaptiveTrainingSession
      responses:
        "200":
          description: Adaptive training session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdaptiveTrainingSessionDto"

  /api/training-sessions/{id}/answers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Training
      summary: Submit one adaptive training round answer
      operationId: answerAdaptiveTrainingSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdaptiveTrainingAnswerRequest"
      responses:
        "200":
          description: Adaptive training session updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdaptiveTrainingSessionDto"

  /api/training-tasks/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Training
      summary: Mark training task as completed
      operationId: completeTrainingTask
      responses:
        "200":
          description: Task marked completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingTaskDto"

  /api/mock-interviews/target/{targetId}:
    parameters:
      - name: targetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - MockInterview
      summary: List mock interviews for a target
      operationId: listMockInterviews
      responses:
        "200":
          description: List of mock interview sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MockInterviewSessionDto"

  /api/mock-interviews/start:
    post:
      tags:
        - MockInterview
      summary: Start mock interview session
      operationId: startMockInterview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockInterviewStartRequest"
      responses:
        "200":
          description: Mock interview started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockInterviewSessionDto"

  /api/mock-interviews/{id}/answer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - MockInterview
      summary: Submit answer during mock interview
      operationId: answerMockInterview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockInterviewAnswerRequest"
      responses:
        "200":
          description: Next question from AI interviewer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockInterviewSessionDto"

  /api/mock-interviews/{id}/finish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - MockInterview
      summary: Finish mock interview and generate report
      operationId: finishMockInterview
      responses:
        "200":
          description: Mock interview report generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockInterviewReportDto"

  /api/mock-interviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - MockInterview
      summary: Get mock interview session
      operationId: getMockInterview
      responses:
        "200":
          description: Mock interview session found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockInterviewSessionDto"

  /api/reports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Report
      summary: Get report by ID
      operationId: getReport
      responses:
        "200":
          description: Report found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDto"

  /api/reports:
    get:
      tags:
        - Report
      summary: List reports by target
      operationId: listReports
      parameters:
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDto"

  /api/ai-providers:
    get:
      tags:
        - AIProvider
      summary: List AI providers
      operationId: listProviders
      responses:
        "200":
          description: List of providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiProviderDto"
    post:
      tags:
        - AIProvider
      summary: Create AI provider
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderCreateRequest"
      responses:
        "200":
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderDto"

  /api/ai-providers/status:
    get:
      tags:
        - AIProvider
      summary: Get current AI runtime status
      operationId: getAiRuntimeStatus
      responses:
        "200":
          description: Current AI runtime status for coaching flows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiRuntimeStatusDto"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/ai-providers/test:
    post:
      tags:
        - AIProvider
      summary: Test AI provider connection
      operationId: testProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderTestRequest"
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderTestResponse"

  /api/ai-providers/models:
    post:
      tags:
        - AIProvider
      summary: List models from an OpenAI-compatible provider
      operationId: listProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProviderModelsRequest"
      responses:
        "200":
          description: Model IDs returned by the provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderModelsResponse"

  /api/ai-providers/{id}/default:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - AIProvider
      summary: Set provider as default
      operationId: setDefaultProvider
      responses:
        "200":
          description: Provider set as default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProviderDto"

  /api/ai-providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - AIProvider
      summary: Delete AI provider
      operationId: deleteProvider
      responses:
        "204":
          description: Provider deleted.

  /api/coaching-memories/target/{targetId}:
    parameters:
      - name: targetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - CoachingMemory
      summary: Get coaching memories for a target
      operationId: getCoachingMemories
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of coaching memories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachingMemoryDto"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/coaching-memories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - CoachingMemory
      summary: Get a coaching memory by ID
      operationId: getCoachingMemory
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Coaching memory details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingMemoryDto"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Coaching memory not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/coaching-memories/{id}/corrections:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - CoachingMemory
      summary: Correct or reject one coaching memory item
      operationId: correctCoachingMemoryItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingMemoryCorrectionRequest"
      responses:
        "200":
          description: Updated coaching memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingMemoryDto"
        "400":
          description: Invalid correction request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Coaching memory not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/coaching-memories/import:
    post:
      tags:
        - CoachingMemory
      summary: Import coaching memories from local archive
      operationId: importCoachingMemories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingMemoryImportRequest"
      responses:
        "200":
          description: Imported coaching memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingMemoryDto"
        "400":
          description: Invalid import request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # -- Shared --
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: "UP"
        service:
          type: string
          example: "interview-coach-backend"

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string

    # -- Auth --
    LoginRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string

    AppleLoginRequest:
      type: object
      required:
        - identityToken
        - nonce
      properties:
        identityToken:
          type: string
        fullName:
          type: string
        nonce:
          type: string
          description: raw nonce for replay protection; backend SHA256 hashes it and compares against the JWT nonce claim

    LoginResponse:
      type: object
      required:
        - token
        - userId
        - username
      properties:
        token:
          type: string
        userId:
          type: string
          format: uuid
        username:
          type: string

    UserDto:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string

    # -- Target --
    InterviewTargetCreateRequest:
      type: object
